baseURL = 'https://blog.oksakura.com/'
languageCode = 'zh-TW'
title = 'Oksakura 博客'
theme = 'hugo-theme-reimu'

defaultContentLanguage = 'zh-TW'
[languages]
[languages.zh-TW]
languageName = '繁體中文'
weight = 1
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false
